naftiko: 1.0.0-alpha2
info:
  label: United Rentals Total Control API — Invoices
  description: 'United Rentals Total Control API — Invoices. 3 operations. Lead operation: List Invoices. Self-contained Naftiko
    capability covering one United Rentals business surface.'
  tags:
  - United Rentals
  - Invoices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UNITED_RENTALS_API_KEY: UNITED_RENTALS_API_KEY
capability:
  consumes:
  - type: http
    namespace: total-control-invoices
    baseUri: https://api.unitedrentals.com/v1
    description: United Rentals Total Control API — Invoices business capability. Self-contained, no shared references.
    resources:
    - name: invoices
      path: /invoices
      operations:
      - name: listinvoices
        method: GET
        description: List Invoices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by invoice status
        - name: startDate
          in: query
          type: string
        - name: endDate
          in: query
          type: string
        - name: purchaseOrderNumber
          in: query
          type: string
          description: Filter by customer purchase order number
    - name: invoices-invoiceId
      path: /invoices/{invoiceId}
      operations:
      - name: getinvoice
        method: GET
        description: Get Invoice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: invoiceId
          in: path
          type: string
          required: true
    - name: invoices-invoiceId-pay
      path: /invoices/{invoiceId}/pay
      operations:
      - name: payinvoice
        method: POST
        description: Pay Invoice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: invoiceId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.UNITED_RENTALS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: total-control-invoices-rest
    port: 8080
    description: REST adapter for United Rentals Total Control API — Invoices. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/invoices
      name: invoices
      description: REST surface for invoices.
      operations:
      - method: GET
        name: listinvoices
        description: List Invoices
        call: total-control-invoices.listinvoices
        with:
          status: rest.status
          startDate: rest.startDate
          endDate: rest.endDate
          purchaseOrderNumber: rest.purchaseOrderNumber
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/invoices/{invoiceid}
      name: invoices-invoiceid
      description: REST surface for invoices-invoiceId.
      operations:
      - method: GET
        name: getinvoice
        description: Get Invoice
        call: total-control-invoices.getinvoice
        with:
          invoiceId: rest.invoiceId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/invoices/{invoiceid}/pay
      name: invoices-invoiceid-pay
      description: REST surface for invoices-invoiceId-pay.
      operations:
      - method: POST
        name: payinvoice
        description: Pay Invoice
        call: total-control-invoices.payinvoice
        with:
          invoiceId: rest.invoiceId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: total-control-invoices-mcp
    port: 9090
    transport: http
    description: MCP adapter for United Rentals Total Control API — Invoices. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-invoices
      description: List Invoices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: total-control-invoices.listinvoices
      with:
        status: tools.status
        startDate: tools.startDate
        endDate: tools.endDate
        purchaseOrderNumber: tools.purchaseOrderNumber
      outputParameters:
      - type: object
        mapping: $.
    - name: get-invoice
      description: Get Invoice
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: total-control-invoices.getinvoice
      with:
        invoiceId: tools.invoiceId
      outputParameters:
      - type: object
        mapping: $.
    - name: pay-invoice
      description: Pay Invoice
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: total-control-invoices.payinvoice
      with:
        invoiceId: tools.invoiceId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
