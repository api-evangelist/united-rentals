naftiko: "1.0.0-alpha1"

info:
  label: "United Rentals Total Control API"
  description: "United Rentals Total Control API for equipment catalog, rental reservations, fleet management, and invoice processing."
  tags:
    - Equipment Rental
    - Procurement
    - Fleet Management
    - Construction
    - Supply Chain
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      UNITED_RENTALS_API_KEY: UNITED_RENTALS_API_KEY

capability:
  consumes:
    - type: http
      namespace: united-rentals-total-control
      baseUri: https://api.unitedrentals.com/v1
      description: "United Rentals Total Control API for equipment rental and fleet management."
      authentication:
        type: apikey
        key: X-API-Key
        value: "{{UNITED_RENTALS_API_KEY}}"
        placement: header
      resources:
        - name: equipment
          path: /equipment
          description: "Equipment catalog and availability"
          operations:
            - name: list-equipment
              method: GET
              description: "Browse the United Rentals equipment catalog"
              inputParameters:
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Equipment category"
                - name: available
                  in: query
                  type: boolean
                  required: false
                  description: "Filter for available equipment only"
                - name: branchId
                  in: query
                  type: string
                  required: false
                  description: "Filter by branch location"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: pageSize
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-equipment
              method: GET
              description: "Get details for specific equipment"
              inputParameters:
                - name: equipmentId
                  in: path
                  type: string
                  required: true
                  description: "Equipment identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: check-equipment-availability
              method: GET
              description: "Check equipment availability for a date range"
              inputParameters:
                - name: equipmentId
                  in: path
                  type: string
                  required: true
                  description: "Equipment identifier"
                - name: startDate
                  in: query
                  type: string
                  required: true
                  description: "Rental start date"
                - name: endDate
                  in: query
                  type: string
                  required: true
                  description: "Rental end date"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: rentals
          path: /rentals
          description: "Rental reservations and management"
          operations:
            - name: create-rental
              method: POST
              description: "Create a new rental reservation with PO"
              inputParameters:
                - name: equipmentId
                  in: body
                  type: string
                  required: true
                  description: "Equipment to rent"
                - name: startDate
                  in: body
                  type: string
                  required: true
                  description: "Rental start date"
                - name: endDate
                  in: body
                  type: string
                  required: true
                  description: "Rental end date"
                - name: jobSite
                  in: body
                  type: string
                  required: true
                  description: "Job site name"
                - name: purchaseOrderNumber
                  in: body
                  type: string
                  required: true
                  description: "Customer PO number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-rentals
              method: GET
              description: "Retrieve rental orders for the account"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Rental status filter"
                - name: jobSite
                  in: query
                  type: string
                  required: false
                  description: "Filter by job site"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-rental
              method: GET
              description: "Get details for a specific rental"
              inputParameters:
                - name: rentalId
                  in: path
                  type: string
                  required: true
                  description: "Rental order identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: extend-rental
              method: POST
              description: "Extend the duration of an active rental"
              inputParameters:
                - name: rentalId
                  in: path
                  type: string
                  required: true
                  description: "Rental order identifier"
                - name: newEndDate
                  in: body
                  type: string
                  required: true
                  description: "New return date"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: return-rental
              method: POST
              description: "Initiate equipment return"
              inputParameters:
                - name: rentalId
                  in: path
                  type: string
                  required: true
                  description: "Rental order identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: fleet
          path: /fleet
          description: "Fleet and worksite management"
          operations:
            - name: get-fleet
              method: GET
              description: "Get real-time fleet overview for all active rentals"
              inputParameters:
                - name: jobSite
                  in: query
                  type: string
                  required: false
                  description: "Filter by job site"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by equipment status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: invoices
          path: /invoices
          description: "Invoice and billing management"
          operations:
            - name: list-invoices
              method: GET
              description: "Retrieve invoices for billing management"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Invoice status filter"
                - name: purchaseOrderNumber
                  in: query
                  type: string
                  required: false
                  description: "Filter by PO number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-invoice
              method: GET
              description: "Get details for a specific invoice"
              inputParameters:
                - name: invoiceId
                  in: path
                  type: string
                  required: true
                  description: "Invoice identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: pay-invoice
              method: POST
              description: "Submit payment for an invoice"
              inputParameters:
                - name: invoiceId
                  in: path
                  type: string
                  required: true
                  description: "Invoice identifier"
                - name: amount
                  in: body
                  type: number
                  required: true
                  description: "Payment amount"
                - name: paymentMethod
                  in: body
                  type: string
                  required: true
                  description: "Payment method (ach, credit-card, check)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: locations
          path: /locations
          description: "Branch location search"
          operations:
            - name: list-locations
              method: GET
              description: "Find United Rentals branch locations"
              inputParameters:
                - name: zipCode
                  in: query
                  type: string
                  required: false
                  description: "Filter by zip code proximity"
                - name: state
                  in: query
                  type: string
                  required: false
                  description: "Filter by state"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: united-rentals-api
      resources:
        - path: /v1/equipment
          name: equipment
          description: "Equipment catalog"
          operations:
            - method: GET
              name: list-equipment
              description: "List available equipment"
              call: "united-rentals-total-control.list-equipment"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/rentals
          name: rentals
          description: "Rental orders"
          operations:
            - method: POST
              name: create-rental
              description: "Create rental reservation"
              call: "united-rentals-total-control.create-rental"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: united-rentals-mcp
      transport: http
      tools:
        - name: list-equipment
          description: "Browse United Rentals equipment catalog by category and location"
          hints:
            readOnly: true
            openWorld: true
          call: "united-rentals-total-control.list-equipment"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-rental
          description: "Create an equipment rental reservation with PO"
          hints:
            readOnly: false
            destructive: false
          call: "united-rentals-total-control.create-rental"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-invoices
          description: "List rental invoices for billing and payment management"
          hints:
            readOnly: true
            openWorld: false
          call: "united-rentals-total-control.list-invoices"
          outputParameters:
            - type: object
              mapping: "$."
