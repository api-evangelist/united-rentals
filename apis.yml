name: United Rentals
description: >-
  United Rentals is the world's largest equipment rental company, headquartered in Stamford, Connecticut. The company
  provides a broad selection of APIs to help customers simplify the procure-to-pay lifecycle for equipment rentals.
  United Rentals offers system integration through its Total Control platform, supporting EDI, cXML, JSON, and flat-file
  formats to connect with customer procurement and ERP systems.
